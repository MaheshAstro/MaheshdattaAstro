  <style>
/* Palette: night sky indigo, marigold, kumkum red, moonlight tint */
:root {
  --night: #C2410C;
  --night-2: #9A3412;
  --moon: #FFF6DB;
  --white: #FFFFFF;
  --marigold: #FFC72C;
  --kumkum: #C2410C;
  --kumkum-dark: #9A3412;
  --deep: #3A1A06;
  --ink: #2B1608;
  --muted: #6B5240;
  --line: #F0D9A8;
  --field-border: #A8845A;

  --font-display: "Yatra One", "Mukta", Georgia, serif;
  --font-body: "Mukta", system-ui, -apple-system, "Segoe UI", sans-serif;
  --wrap: 1120px;
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 76px; }
body {
  margin: 0;
  font-family: var(--font-body);
  font-size: 1.125rem;
  line-height: 1.65;
  color: var(--ink);
  background: var(--white);
}
img, svg, iframe { max-width: 100%; }
a { color: var(--kumkum); }
a:hover { color: var(--kumkum-dark); }

h1, h2, h3 { font-family: var(--font-display); font-weight: 400; line-height: 1.2; margin: 0 0 .6em; }
h1 { font-size: clamp(2.2rem, 5vw, 3.6rem); }
h2 { font-size: clamp(1.7rem, 3.2vw, 2.4rem); }
h3 { font-size: 1.25rem; margin-bottom: .3em; }
p { margin: 0 0 1em; max-width: 62ch; }

:focus-visible { outline: 3px solid var(--kumkum); outline-offset: 3px; }
.on-dark :focus-visible { outline-color: var(--marigold); }

.wrap { width: min(100% - 2.5rem, var(--wrap)); margin-inline: auto; }
.skip-link {
  position: absolute; left: -999px; top: 0; z-index: 100;
  background: var(--marigold); color: var(--deep); padding: .6rem 1rem;
}
.skip-link:focus { left: 0; }

/* Dark sections */
.on-dark { background: var(--night); color: var(--moon); }
.on-dark a { color: var(--moon); }
.on-dark a:hover { color: #FFFFFF; }

/* Buttons */
.btn {
  display: inline-block; padding: .75rem 1.4rem; border-radius: 6px;
  font: 700 1rem/1.2 var(--font-body); text-decoration: none; text-align: center;
  border: 2px solid transparent; cursor: pointer;
}
.btn-primary { background: var(--kumkum); color: var(--white); }
.btn-primary:hover { background: var(--kumkum-dark); color: var(--white); }
.btn-outline { border-color: var(--kumkum); color: var(--kumkum); background: transparent; }
.btn-outline:hover { background: var(--kumkum); color: var(--white); }
.on-dark .btn-gold, .btn-gold { background: var(--marigold); color: var(--deep); }
.on-dark .btn-gold:hover { background: #FFD966; color: var(--deep); }
.on-dark .btn-ghost { border-color: var(--moon); color: var(--moon); }
.on-dark .btn-ghost:hover { background: var(--moon); color: var(--night); }
.btn-small { padding: .5rem 1rem; }
.btn-row { display: flex; flex-wrap: wrap; gap: .8rem; }

/* Header */
.site-header { position: sticky; top: 0; z-index: 50; border-bottom: 1px solid rgba(255, 246, 219, .3); }
.header-row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; min-height: 68px; }
.brand { display: flex; align-items: center; gap: .6rem; text-decoration: none; color: var(--moon) !important; font: 400 1.25rem var(--font-display); }
.brand-mark { width: 30px; height: 30px; }
.site-nav { display: flex; align-items: center; gap: 1.4rem; }
.site-nav a:not(.btn) { color: var(--moon); text-decoration: none; font-weight: 600; }
.site-nav a:not(.btn):hover { color: #FFFFFF; text-decoration: underline; text-underline-offset: 4px; }
.nav-toggle {
  display: none; background: none; color: var(--moon); border: 2px solid var(--moon);
  border-radius: 6px; padding: .4rem .9rem; font: 600 1rem var(--font-body); cursor: pointer;
}

/* Hero */
.hero { padding: clamp(2.5rem, 7vw, 5.5rem) 0; }
.hero-grid { display: grid; grid-template-columns: 1.1fr .9fr; gap: clamp(2rem, 5vw, 4rem); align-items: center; }
.lead { font-size: 1.3rem; line-height: 1.55; }
.hero-actions { display: flex; flex-wrap: wrap; gap: .8rem; margin: 1.6rem 0 1rem; }
.hero-phone { color: #FFF0C7; }
.chart { margin: 0; }
.chart svg { display: block; width: 100%; height: auto; }
.chart figcaption { margin-top: .8rem; font-size: .95rem; color: #FFF0C7; text-align: center; }

/* One orchestrated moment: the chart draws itself once on load */
.draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.5s ease-out forwards; animation-delay: calc(var(--i) * .22s); }
.chart-planets { opacity: 0; animation: appear .9s ease-out 1.4s forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes appear { to { opacity: 1; } }

/* Sections */
.section { padding: clamp(3rem, 7vw, 5.5rem) 0; }
.section-tint { background: var(--moon); }
.split { display: grid; grid-template-columns: 5fr 7fr; gap: clamp(2rem, 5vw, 4.5rem); align-items: start; }
.split-head { position: sticky; top: 96px; }
.split-head p { color: var(--muted); }

.service-list article { padding: 1.25rem 0; border-top: 2px solid var(--line); }
.service-list article:first-child { border-top: 2px solid var(--kumkum); }
.section-tint .service-list article { border-top-color: #E8CF96; }
.section-tint .service-list article:first-child { border-top-color: var(--kumkum); }
.service-list p { margin: 0; color: var(--muted); }

/* About */
.about-grid { display: grid; grid-template-columns: 320px 1fr; gap: clamp(2rem, 5vw, 4rem); align-items: center; }
.about-photo { width: 100%; height: auto; border-radius: 6px; background: var(--moon); }

/* Ask form */
.ask-grid { display: grid; grid-template-columns: 7fr 4fr; gap: clamp(2rem, 5vw, 4rem); align-items: start; }
.form-intro { color: var(--muted); }
.form { display: grid; gap: 1.1rem; margin-top: 1.5rem; }
.field-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 1.1rem; }
.field label, .birth legend { display: block; font-weight: 600; margin-bottom: .3rem; }
.opt { font-weight: 400; color: var(--muted); }
input[type="text"], input[type="email"], input[type="tel"], input[type="date"], input[type="time"], select, textarea {
  width: 100%; font: inherit; color: var(--ink); background: var(--white);
  border: 1.5px solid var(--field-border); border-radius: 6px; padding: .65rem .8rem;
}
textarea { resize: vertical; min-height: 9rem; }
input:focus, select:focus, textarea:focus { outline: 3px solid var(--kumkum); outline-offset: 1px; border-color: var(--kumkum); }
.birth { border: 0; padding: 0; margin: 0; }
.birth legend { padding: 0; width: 100%; }
.birth { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
.birth legend { grid-column: 1 / -1; margin-bottom: 0; }
.check { display: flex; gap: .7rem; align-items: flex-start; }
.check input { width: 1.25rem; height: 1.25rem; margin-top: .3rem; accent-color: var(--kumkum); flex: none; }
.check label { font-size: 1rem; }
.form .btn { justify-self: start; }
.form .btn[disabled] { opacity: .65; cursor: wait; }
.hp { position: absolute; left: -9999px; height: 0; overflow: hidden; }
.form-status { margin: 0; padding: 0; font-weight: 600; }
.form-status.is-ok, .form-status.is-error { padding: .9rem 1rem; border-radius: 6px; max-width: none; }
.form-status.is-ok { background: #E3F4E6; color: #14532D; }
.form-status.is-error { background: #FBE6E8; color: #7A1220; }
.form-status a { color: inherit; }

.next-steps { background: var(--white); border-left: 4px solid var(--marigold); padding: 1.5rem; border-radius: 0 6px 6px 0; }
.next-steps ol { margin: 0; padding-left: 1.3rem; }
.next-steps li { margin-bottom: .9rem; padding-left: .3rem; }
.next-steps li:last-child { margin-bottom: 0; }

.form-embed { margin-top: 1.5rem; }
.form-embed iframe { display: block; width: 100%; max-width: 100%; height: 1150px; border: 0; border-radius: 6px; background: var(--white); }
.form-soon { padding: 1.2rem; background: var(--white); border: 1.5px dashed var(--field-border); border-radius: 6px; max-width: none; }
.form-note { margin-top: 1rem; font-size: 1rem; color: var(--muted); }

/* Podcast */
.podcast-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 2rem 4rem; align-items: center; }
.podcast-grid .player { grid-column: 1 / -1; }
.listen-links { display: grid; gap: .7rem; }
.listen {
  display: block; padding: 1rem 1.2rem; border: 2px solid var(--night-2); background: var(--night-2);
  border-radius: 6px; text-decoration: none; font-weight: 700; color: var(--moon) !important;
}
.listen:hover { border-color: var(--marigold); }

/* Find us */
.find-grid { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(2rem, 5vw, 4rem); align-items: center; }
address { font-style: normal; margin: 0 0 1.4rem; }
.map iframe { width: 100%; height: 340px; border: 0; border-radius: 6px; background: var(--moon); }

/* FAQ */
.faq-wrap { max-width: 820px; }
details { border-top: 2px solid #E8CF96; padding: 1rem 0; }
details:last-of-type { border-bottom: 2px solid #E8CF96; }
summary { cursor: pointer; font-weight: 700; font-size: 1.15rem; }
details p { margin: .7rem 0 0; color: var(--muted); }

/* Footer */
.site-footer { padding: 3rem 0 1.5rem; }
.footer-grid { display: grid; grid-template-columns: 1fr 1fr 1.4fr; gap: 2rem; }
.site-footer p { margin: 0 0 .4rem; }
.footer-name { font: 400 1.3rem var(--font-display); }
.disclaimer { color: #FFF0C7; font-size: .95rem; }
.copyright { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid rgba(255, 246, 219, .3); color: #FFF0C7; font-size: .95rem; }

/* Simple pages (privacy, 404) */
.page { padding: 3rem 0 5rem; max-width: 760px; }
.page h2 { margin-top: 1.8em; font-size: 1.5rem; }

/* Mobile */
@media (max-width: 860px) {
  .hero-grid, .split, .about-grid, .ask-grid, .podcast-grid, .find-grid, .footer-grid { grid-template-columns: 1fr; }
  .split-head { position: static; }
  .chart { max-width: 380px; margin-inline: auto; }
  .about-grid .about-photo { max-width: 280px; }
  .nav-toggle { display: inline-block; }
  .site-nav {
    display: none; position: absolute; left: 0; right: 0; top: 100%;
    flex-direction: column; align-items: stretch; gap: 0;
    background: var(--night); padding: .5rem 1.25rem 1.2rem; border-bottom: 1px solid rgba(255, 246, 219, .3);
  }
  .site-nav.is-open { display: flex; }
  .site-nav a:not(.btn) { padding: .8rem 0; border-bottom: 1px solid rgba(255, 246, 219, .25); }
  .site-nav .btn { margin-top: 1rem; }
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .draw { animation: none; stroke-dashoffset: 0; }
  .chart-planets { animation: none; opacity: 1; }
}
